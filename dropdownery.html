<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f6fa;
  padding: 40px;
  transition: background 0.3s, color 0.3s;
}

/* Dropdown container */
.dropdown {
  position: fixed;
  display: inline-block;
}

/* Settings Button */
.settings-btn {
  background: #1f2937;
  color: white;
  border: none;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Dropdown Menu */
.menu {
  position: absolute;
  right: 0;
  top: 110%;
  width: 260px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
  padding: 10px 0;

  opacity: 0;
  transform: translateY(-20px); /* slide from top */
  pointer-events: none;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

/* Show menu */
.menu.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

/* Menu item */
.menu-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  font-size: 15px;
  cursor: pointer;
}

.menu-item:hover {
  background: #f3f4f6;
}

.menu-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Toggle Switch */
.switch {
  position: relative;
  width: 40px;
  height: 22px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: #d1d5db;
  border-radius: 20px;
  transition: 0.3s;
}

.slider:before {
  content: "";
  position: absolute;
  height: 18px;
  width: 18px;
  left: 2px;
  bottom: 2px;
  background-color: white;
  border-radius: 50%;
  transition: 0.3s;
}

input:checked + .slider {
  background-color: #2563eb;
}

input:checked + .slider:before {
  transform:translateX(18px);
}

/* Divider */
.divider {
  height: 1px;
  background: #e5e7eb;
  margin: 6px 0;
}

/* Mobile bottom sheet slide-up */
@media (max-width: 600px) {
  .menu {
    position: fixed;
    bottom: -100%;
    left: 0;
    right: 0;
    top: auto;
    width: 100%;
    border-radius: 20px 20px 0 0;
    transition: bottom 0.3s ease;
  }
  .menu.show {
    bottom: 0;
  }
}

/* SVG icon styling */
.menu-left svg {
  width: 20px;
  height: 20px;
  fill: #2563eb;
}
</style>
</head>
<body>

<div class="dropdown">
  <button class="settings-btn" id="settingsBtn">
    <!-- Gear icon -->
    <svg viewBox="0 0 24 24"><path fill="white" d="M12 1.75a2.25 2.25 0 0 1 2.25 2.25v.66a7.93 7.93 0 0 1 2.28 1.32l.46-.46a2.25 2.25 0 0 1 3.18 3.18l-.46.46a7.93 7.93 0 0 1 1.32 2.28h.66a2.25 2.25 0 0 1 0 4.5h-.66a7.93 7.93 0 0 1-1.32 2.28l.46.46a2.25 2.25 0 0 1-3.18 3.18l-.46-.46a7.93 7.93 0 0 1-2.28 1.32v.66a2.25 2.25 0 0 1-4.5 0v-.66a7.93 7.93 0 0 1-2.28-1.32l-.46.46a2.25 2.25 0 0 1-3.18-3.18l.46-.46a7.93 7.93 0 0 1-1.32-2.28h-.66a2.25 2.25 0 0 1 0-4.5h.66a7.93 7.93 0 0 1 1.32-2.28l-.46-.46a2.25 2.25 0 1 1 3.18-3.18l.46.46a7.93 7.93 0 0 1 2.28-1.32v-.66A2.25 2.25 0 0 1 12 1.75ZM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
    Settings
  </button>

  <div class="menu" id="settingsMenu">

    <!-- Dark Mode -->
    <div class="menu-item">
      <div class="menu-left">
        <!-- Moon SVG -->
        <svg viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z"/>
        </svg>
        <span>Dark Mode</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Notifications -->
    <div class="menu-item">
      <div class="menu-left">
        <!-- Bell SVG -->
        <svg viewBox="0 0 24 24">
          <path d="M12 24a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 24ZM19 17H5v-6a7 7 0 1 1 14 0v6Z"/>
        </svg>
        <span>Notifications</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="notifToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="divider"></div>

    <!-- Profile -->
    <div class="menu-item" onclick="alert('Profile clicked')">
      <div class="menu-left">
        <!-- User SVG -->
        <svg viewBox="0 0 24 24">
          <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4 0-7 2-7 6v2h14v-2c0-4-3-6-7-6Z"/>
        </svg>
        <span>Profile</span>
      </div>
    </div>

    <!-- Logout -->
    <div class="menu-item" onclick="alert('Logout clicked')">
      <div class="menu-left">
        <!-- Logout SVG -->
        <svg viewBox="0 0 24 24">
          <path d="M16 17v-2h-4v-2h4v-2l3 3-3 3Zm-7 4h8v-2H9v-12h8V7H9v14Z"/>
        </svg>
        <span>Logout</span>
      </div>
    </div>

  </div>
</div>

<script>
const btn = document.getElementById("settingsBtn");
const menu = document.getElementById("settingsMenu");
const darkToggle = document.getElementById("darkToggle");
const notifToggle = document.getElementById("notifToggle");

// Detect system dark mode
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  darkToggle.checked = true;
  document.body.style.background = "#111";
  document.body.style.color = "white";
}

// Load saved dark mode preference
if (localStorage.getItem("darkMode") === "true") {
  darkToggle.checked = true;
  document.body.style.background = "#111";
  document.body.style.color = "white";
} else if (localStorage.getItem("darkMode") === "false") {
  darkToggle.checked = false;
  document.body.style.background = "#f5f6fa";
  document.body.style.color = "black";
}

// Toggle dark mode
darkToggle.addEventListener("change", function() {
  const isDark = darkToggle.checked;
  document.body.style.background = isDark ? "#111" : "#f5f6fa";
  document.body.style.color = isDark ? "white" : "black";
  localStorage.setItem("darkMode", isDark);
});

// Toggle notifications (optional localStorage)
notifToggle.addEventListener("change", function() {
  localStorage.setItem("notifications", notifToggle.checked);
});

// Show/hide menu
btn.addEventListener("click", function(e) {
  e.stopPropagation();
  menu.classList.toggle("show");
});

// Close when clicking outside
document.addEventListener("click", function() {
  menu.classList.remove("show");
});
</script>

</body>
</html>
